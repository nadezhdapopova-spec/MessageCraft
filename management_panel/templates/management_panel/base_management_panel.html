{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Панель менеджера{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: "Inter", sans-serif;
    }
    .sidebar {
      width: 260px;
      background: #1e7b34;
      color: #fff;
      min-height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      padding-top: 2rem;
    }
    .sidebar a {
      color: #d9f5df;
      text-decoration: none;
      display: block;
      padding: 12px 20px;
      transition: all 0.2s;
    }
    .sidebar a:hover, .sidebar a.active {
      background: #2f9746;
      color: white;
    }
    .content {
      margin-left: 260px;
      padding: 2rem;
    }
    .navbar {
      background: #f8fff8;
      border-bottom: 1px solid #d8edd8;
    }
    .btn-success, .bg-success {
      background-color: #2f9746 !important;
      border: none;
    }
    .table thead {
      background-color: #e6f5ea;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <h4 class="text-center fw-bold mb-4">🌿 Панель менеджера</h4>
    <a href="{% url 'management_panel:users_management' %}" class="{% if request.path == '/management_panel/users/' %}active{% endif %}">👥 Пользователи</a>
    <a href="{% url 'management_panel:campaigns_management' %}" class="{% if request.path == '/management_panel/campaigns/' %}active{% endif %}">📢 Рассылки</a>
    <a href="{% url 'reports:campaign_report' %}">📊 Отчёты по рассылкам</a>
    <hr class="text-light">
    <a href="{% url 'reports:home' %}">🚪 На главную страницу</a>
  </div>

  <div class="content">
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
