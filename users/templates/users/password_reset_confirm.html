{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
  <div class="card shadow-lg p-4 mx-auto" style="max-width: 480px; border-radius: 1rem;">
    <h3 class="text-center mb-4 text-success fw-bold">Новый пароль</h3>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-success w-100 py-2 mt-3">Сохранить пароль</button>
    </form>
  </div>
</div>
{% endblock %}
