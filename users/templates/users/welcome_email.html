<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Приветственное письмо при регистрации MessageCraft</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
        .container { background-color: #fff; padding: 20px; border-radius: 10px; }
        h1 { color: #4CAF50; }
        p { font-size: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ user.username }}, добро пожаловать в MessageCraft!</h1>
        <p>Спасибо, что зарегистрировались. Мы рады видеть вас в нашем сервисе.</p>
        <p>Начните создавать свои сообщения прямо сейчас!</p>
    </div>
</body>
</html>
