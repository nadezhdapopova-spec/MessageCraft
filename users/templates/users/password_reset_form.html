{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
  <div class="card shadow-lg p-4 mx-auto" style="max-width: 480px; border-radius: 1rem;">
    <h3 class="text-center mb-4 text-success fw-bold">Восстановление пароля</h3>
    <p class="text-muted text-center">
      Введите свой адрес электронной почты, и мы отправим ссылку для сброса пароля
    </p>

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Email:</label>
        {{ form.email }}
      </div>
      <button type="submit" class="btn btn-success w-100 py-2">Отправить ссылку</button>
    </form>

    <div class="text-center mt-3">
      <a href="{% url 'users:login' %}" class="text-decoration-none text-success">Вернуться к входу</a>
    </div>
  </div>
</div>
{% endblock %}
