[tool.poetry]
name = "messagecraft"
version = "0.1.0"
description = "Study project for creating django web application"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.2.7"
poetry-core = "^2.2.1"
python-dotenv = "^1.2.1"
psycopg2-binary = "^2.9.11"
django-apscheduler = "^0.7.0"


[tool.poetry.group.dev.dependencies]
pillow = "^12.0.0"
ipython = "^9.6.0"
crispy-bootstrap5 = "^2025.6"
django-countries = "^7.6.1"
django-phonenumber-field = "^8.3.0"
phonenumbers = "^9.0.17"
redis = "^7.0.1"
faker = "^37.12.0"
django-extensions = "^4.1"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
mypy = "^1.18.2"
isort = "^7.0.0"
black = "^25.9.0"

[tool.mypy]
disallow_untyped_defs=true
warn_return_any=true
exclude = """
/(
    .git
    .venv
    venv
)/
"""

[tool.black]
line-length = 119
exclude = """
/(
    .git
  | .hg
  | .mypy_cache
  | .tox
  | .venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
  | static
  | media
  | node_modules
  | __pycache__
  | manage.py
  | settings.py
  | asgi.py
  | wsgi.py
)/
"""

[tool.isort]
profile = "black"
line_length = 119
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
combine_as_imports = true
skip_gitignore = true
known_django = ["django"]
sections = ["FUTURE", "STDLIB", "DJANGO", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
default_section = "THIRDPARTY"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
