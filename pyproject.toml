[tool.poetry]
name = "messagecraft"
version = "0.1.0"
description = "Study project for creating django web application"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.2.7"
poetry-core = "^2.2.1"
python-dotenv = "^1.2.1"
psycopg2-binary = "^2.9.11"
django-apscheduler = "^0.7.0"


[tool.poetry.group.dev.dependencies]
pillow = "^12.0.0"
ipython = "^9.6.0"
crispy-bootstrap5 = "^2025.6"
rapidfuzz = "^3.14.3"
fuzzywuzzy = "^0.18.0"
django-countries = "^7.6.1"
django-phonenumber-field = "^8.3.0"
phonenumbers = "^9.0.17"
redis = "^7.0.1"
faker = "^37.12.0"
django-extensions = "^4.1"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
mypy = "^1.18.2"
isort = "^7.0.0"
black = "^25.9.0"

[tool.mypy]
disallow_untyped_defs=true
warn_return_any=true
exclude = """
/(
    .git
    .venv
    venv
)/
"""

[tool.black]
line-length = 119
exclude = """
/(
    .git
    .venv
    venv
)/
"""

[tool.isort]
line_length = 119
multi_line_output = 3

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
